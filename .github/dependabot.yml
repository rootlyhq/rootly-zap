version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
    assignees:
      - kwent
    labels:
      - dependencies
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "⬆️ chore"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
    assignees:
      - kwent
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: "🚀 ci"
