on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ROOTLY_API_KEY: ${{ secrets.ROOTLY_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm install
      - run: echo '{"deployKey":"${{secrets.ZAPIER_DEPLOY_KEY}}"}' > "$HOME/.zapierrc"
      - run: npm test
      - run: npm run validate
