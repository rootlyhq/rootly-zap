name: Publish

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check tag is a semver version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not a semver version (X.Y.Z)"
            exit 1
          fi
      - run: npm ci
      - name: Sync package.json version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "$TAG" --no-git-tag-version --allow-same-version
      - name: Configure Zapier deploy key
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: |
          node -e 'require("fs").writeFileSync(`${process.env.HOME}/.zapierrc`, JSON.stringify({ deployKey: process.env.ZAPIER_DEPLOY_KEY }))'
      - run: npm run validate
      - run: npm run zapier -- push
      - name: Promote version
        env:
          TAG: ${{ github.ref_name }}
        run: npm run zapier -- promote "$TAG" --yes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
