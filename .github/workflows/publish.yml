name: Publish

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version
      - run: echo '{"deployKey":"${{secrets.ZAPIER_DEPLOY_KEY}}"}' > "$HOME/.zapierrc"
      - run: npx zapier-platform push
      - run: npx zapier-platform promote ${{ github.ref_name }} --yes
      - run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
